[package]
name = "netex2gtfs"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NeTEx to GTFS: a NeTEx delivery, read and resolved by netex-rs, written as a GTFS feed, with a report of everything it could not carry over"
readme = "README.md"
keywords = ["netex", "gtfs", "transmodel", "public-transport", "timetable"]
categories = ["parser-implementations", "encoding"]

# docs.rs builds the documentation with every feature, as for netex-rs.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# The reading, the resolution and the index; with positions in national
# reference systems turned into WGS 84, which GTFS requires.
netex-rs = { version = "0.9.0", path = "../..", features = ["crs"] }
rustc-hash = "2"
# The interner keeps each string once, as netex-rs's does.
hashbrown = { version = "0.17", default-features = false }
# The report is written as JSON by the command line.
serde = { version = "1", features = ["derive"] }
# A feed is a zip archive of CSV files, each deflated in pieces on every
# thread, through the pure-Rust zlib port; with the checksum zip takes.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
rayon = "1.10"

[dev-dependencies]
# The tests read the feeds written back, as a consumer would.
csv = "1"
# The tests read the archives written back.
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
