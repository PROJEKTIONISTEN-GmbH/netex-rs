[package]
name = "netex-cli"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The netex command: a checking report for NeTEx deliveries, their statistics, conversion to GTFS, regional cuts and the merge of several deliveries"
readme = "README.md"
keywords = ["netex", "gtfs", "validation", "public-transport", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "netex"
path = "src/main.rs"

# docs.rs builds the documentation with every feature, as for netex-rs.
[package.metadata.docs.rs]
all-features = true

[dependencies]
netex-rs = { version = "0.7.2", path = "../..", features = ["crs", "serde"] }
netex2gtfs = { version = "0.1.3", path = "../netex2gtfs" }
quick-xml = "0.42"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
# The report is checked against its published schema.
jsonschema = { version = "0.49", default-features = false }

[lints]
workspace = true
