# The checks every change of netex-rs, netex2gtfs and netex-cli passes. They
# need nothing from outside the repository; the whole German delivery is read
# only where a runner is told where it is.
#
# The runner image is named, not `ubuntu-latest`: the schema tests read what
# the image's xmllint writes, and libxml2 words its complaints otherwise from
# one release to the next (2.9 on Ubuntu 24.04, 2.15 on 26.04). A new image is
# a change of this file, tried like any other. `tools/ci_tests.py` runs the
# job "build and test" as a runner does, in a shallow clone of HEAD.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The conformance tests validate against the official schemas with xmllint.
      - run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - run: xmllint --version
      - run: cargo build --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      # The reference systems are a feature of the core; netex2gtfs and netex-cli turn it on.
      - run: cargo test --locked -p netex-rs --features crs

  msrv:
    name: minimum supported Rust (1.86)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.86 check --locked --workspace --all-targets

  windows:
    name: builds for Windows
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # The archives are read by position: `read_at` on Unix, `seek_read` on Windows.
      - run: cargo check --locked --workspace --all-targets --all-features --target x86_64-pc-windows-gnu

  lint:
    name: rustfmt, clippy, rustdoc
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The core without its features, as a consumer that needs none builds it.
      - run: cargo clippy --locked -p netex-rs --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  tables:
    name: release tables match the schemas
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tools/schema_table.py
      - run: git diff --exit-code src/version/table.rs docs/VERSIONS.md

  bench:
    name: the benchmark tool
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The tool's tests measure, convert and compare two of the repository's
      # own small deliveries with the command they are given.
      - run: cargo build --locked -p netex-cli
      - run: python3 -m unittest discover -s tools/bench -v
        env:
          NETEX_BIN: target/debug/netex

  package:
    name: packages
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The three are packaged and built as they will be published: in
      # dependency order, each against the packages before it, so that a new
      # version of the core need not be on crates.io for the others to build.
      - run: cargo package --locked --allow-dirty --workspace
      # crates.io takes at most 10 MB; the official schemas and examples, the
      # tools and the other members stay out of the core's package.
      - name: the packages stay small and carry no third-party schemas
        run: |
          for crate in target/package/*.crate; do
            size=$(stat --format=%s "$crate")
            echo "$crate: $size bytes"
            test "$size" -lt 10000000
          done
          if cargo package --list --locked --allow-dirty -p netex-rs | grep -E '^(tests/fixtures/netex-|tools/|crates/)'; then
            echo "the core's package carries what it must not"
            exit 1
          fi
      # A package carries less than the repository: its tests run on what it
      # carries, each against the packages before it, as a user of the
      # published version runs them.
      - name: the tests of the packages pass on what they carry
        run: python3 tools/package_tests.py

  hygiene:
    name: nothing internal, in files and commit messages
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test publish_hygiene -- --nocapture
        env:
          NETEX_COMMITS: HEAD

  corpus:
    name: the whole German delivery
    runs-on: ubuntu-26.04
    env:
      # A repository variable naming the DELFI zip archive on the runner.
      NETEX_DELFI_ZIP: ${{ vars.NETEX_DELFI_ZIP }}
    steps:
      - uses: actions/checkout@v7
      - name: skipped where no delivery is named
        if: env.NETEX_DELFI_ZIP == ''
        run: echo "::notice title=DELFI corpus::skipped, NETEX_DELFI_ZIP is not set"
      - uses: dtolnay/rust-toolchain@stable
        if: env.NETEX_DELFI_ZIP != ''
      - if: env.NETEX_DELFI_ZIP != ''
        run: cargo test --locked --release --test corpus -- --nocapture

  fuzz:
    name: fuzz, briefly
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        target: [read, rewrite, convert, outline]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -dict="$GITHUB_WORKSPACE/fuzz/netex.dict" -max_total_time=120
